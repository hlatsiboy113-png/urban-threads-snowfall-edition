<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account — Urban Threads Kids</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="login">

  <div class="auth-page">
    <div class="auth-card" id="login-card">
      <div class="auth-header">
        <p class="auth-logo">Urban<span>.</span></p>
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Sign in to access your cart, wishlist, and orders.</p>
      </div>
      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="login-email">Email</label>
          <input type="email" id="login-email" class="form-input" placeholder="you@example.com" required aria-required="true" autocomplete="email">
          <p class="form-error hidden" id="login-email-error"></p>
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="Enter your password" required aria-required="true" autocomplete="current-password">
          <p class="form-error hidden" id="login-password-error"></p>
        </div>
        <p class="form-error hidden" id="login-general-error" style="margin-bottom: var(--space-4);"></p>
        <button type="submit" class="btn btn-dark btn-full">Sign In</button>
      </form>
      <p class="auth-toggle">Don't have an account? <a href="#" id="show-signup">Create one</a></p>
    </div>

    <div class="auth-card hidden" id="signup-card">
      <div class="auth-header">
        <p class="auth-logo">Urban<span>.</span></p>
        <h1 class="auth-title">Create account</h1>
        <p class="auth-subtitle">Join Urban Threads Kids for exclusive drops and faster checkout.</p>
      </div>
      <form id="signup-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="signup-name">Full Name</label>
          <input type="text" id="signup-name" class="form-input" placeholder="Your name" required aria-required="true" autocomplete="name">
          <p class="form-error hidden" id="signup-name-error"></p>
        </div>
        <div class="form-group">
          <label class="form-label" for="signup-email">Email</label>
          <input type="email" id="signup-email" class="form-input" placeholder="you@example.com" required aria-required="true" autocomplete="email">
          <p class="form-error hidden" id="signup-email-error"></p>
        </div>
        <div class="form-group">
          <label class="form-label" for="signup-password">Password</label>
          <input type="password" id="signup-password" class="form-input" placeholder="Min. 6 characters" required aria-required="true" minlength="6" autocomplete="new-password">
          <p class="form-hint">Must be at least 6 characters.</p>
          <p class="form-error hidden" id="signup-password-error"></p>
        </div>
        <div class="form-group">
          <label class="form-label" for="signup-confirm">Confirm Password</label>
          <input type="password" id="signup-confirm" class="form-input" placeholder="Confirm your password" required aria-required="true" autocomplete="new-password">
          <p class="form-error hidden" id="signup-confirm-error"></p>
        </div>
        <p class="form-error hidden" id="signup-general-error" style="margin-bottom: var(--space-4);"></p>
        <button type="submit" class="btn btn-dark btn-full">Create Account</button>
      </form>
      <p class="auth-toggle">Already have an account? <a href="#" id="show-login">Sign in</a></p>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
