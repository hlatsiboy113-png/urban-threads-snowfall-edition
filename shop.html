<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Shop streetwear at Urban Threads. Hoodies, t-shirts, sneakers, and accessories.">
  <title>Shop — Urban Threads</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="shop">

  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="container navbar-inner">
      <a href="index.html" class="logo">Urban<span>.</span></a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="shop.html" class="nav-link active">Shop</a>
        <a href="shop.html?category=Hoodies" class="nav-link">Collections</a>
        <a href="index.html#about" class="nav-link">About</a>
      </div>
      <div class="nav-actions">
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <div id="nav-auth-links" class="flex items-center gap-4">
          <a href="login.html" class="nav-link">Login</a>
        </div>
        <div id="nav-user-links" class="flex items-center gap-4 hidden">
          <span class="user-name" id="nav-user-name"></span>
          <a href="account.html" class="nav-btn" aria-label="Account">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </a>
          <a href="cart.html" class="nav-btn" aria-label="Cart">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            <span class="cart-count" style="display:none;">0</span>
          </a>
          <button class="nav-btn" id="nav-logout" aria-label="Logout">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
        <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Open menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <div class="mobile-nav" id="mobile-nav" aria-hidden="true">
    <div class="mobile-nav-header">
      <a href="index.html" class="logo">Urban<span>.</span></a>
      <button class="mobile-nav-close" id="mobile-nav-close" aria-label="Close menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="mobile-nav-links">
      <a href="index.html" class="mobile-nav-link">Home</a>
      <a href="shop.html" class="mobile-nav-link">Shop</a>
      <a href="cart.html" class="mobile-nav-link">Cart</a>
      <a href="account.html" class="mobile-nav-link">Account</a>
      <a href="login.html" class="mobile-nav-link">Login</a>
    </div>
  </div>

  <header class="page-header">
    <div class="container">
      <h1 class="page-title">Shop All</h1>
      <p class="page-subtitle">Discover our full collection of streetwear essentials</p>
    </div>
  </header>

  <section class="section-sm">
    <div class="container">
      <div class="shop-controls">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="search" id="shop-search" placeholder="Search products..." aria-label="Search products">
        </div>
        <div class="filter-group">
          <select id="shop-sort" class="filter-select" aria-label="Sort products">
            <option value="featured">Featured</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="name-asc">Name: A to Z</option>
          </select>
        </div>
      </div>

      <div class="category-pills">
        <button class="category-pill active" data-category="All">All</button>
        <button class="category-pill" data-category="Hoodies">Hoodies</button>
        <button class="category-pill" data-category="T-Shirts">T-Shirts</button>
        <button class="category-pill" data-category="Sneakers">Sneakers</button>
        <button class="category-pill" data-category="Accessories">Accessories</button>
      </div>

      <p class="results-count" id="results-count">Loading products...</p>

      <div class="products-grid" id="shop-products-grid">
        <!-- Products loaded dynamically from Firestore -->
      </div>
    </div>
  </section>

  <footer class="footer" role="contentinfo">
    <div class="container">
      <div class="footer-bottom" style="border-top:none; padding-top:0;">
        <p class="footer-copyright">&copy; 2024 Urban Threads. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
